name: Link Check

on:
  push:
    branches: [main]
    paths:
      - "**.md"
  pull_request:
    paths:
      - "**.md"
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Medium and YouTube often answer bots with 403/429, which are not dead links.
          args: >-
            --no-progress
            --max-retries 3
            --accept 200..=299,403,429
            --exclude-path CODE_OF_CONDUCT.md
            README.md CONTRIBUTING.md OPEN_SOURCE_PROJECTS.md
          fail: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Outside PRs, report through one issue instead of failing silently.
      # Reuse the open bot issue if there is one, so repeat failures do not pile up.
      # Filter by author so issues filed by people with the same label are never touched.
      - name: Find existing link-check issue
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        id: find
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                --author app/github-actions --search "Broken links found in:title" \
                --json number --jq '.[0].number // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or update issue for broken links
        if: github.event_name != 'pull_request' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found by link check
          content-filepath: ./lychee/out.md
          labels: broken link
          issue-number: ${{ steps.find.outputs.number }}
